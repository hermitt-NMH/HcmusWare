<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Linh kiện máy tính và công cụ build PC kiểm tra tương thích"
    />
    <!-- Mở sẵn kết nối tới Supabase trong lúc JS còn tải (Vite điền biến VITE_SUPABASE_URL lúc build) -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Tải font không chặn hiển thị: trang vẽ bằng font hệ thống trước, có font thì đổi (display=swap) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      onload="
        this.onload = null
        this.rel = 'stylesheet'
      "
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      />
    </noscript>
    <title>HcmusWare – Linh kiện máy tính</title>
    <meta name="color-scheme" content="light dark" />
    <!-- Đặt giao diện sáng/tối TRƯỚC khi vẽ trang để không nháy màu (cùng logic resolveTheme trong src/lib/theme.js) -->
    <script>
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('hcmusware.theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark')
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        if (theme === 'dark') document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
